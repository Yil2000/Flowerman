<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowerman</title>
    <link rel="stylesheet" href="loginAdmin.css" />
    <link rel="icon" href="flowerman-logo.PNG" />
  </head>
  <body>
    <div id="admin-content" style="display: none">
      <!-- Sidebar -->
      <div id="sidebar">
        <img src="flowerman-logo.PNG" alt="Flowerman Logo" />
        <button data-target="comments-section">קיר השיתופים</button>
        <button data-target="contacts-container">טפסי יצירת קשר</button>
        <button data-target="upload-section">העלאת תמונות</button>
        <button data-target="manage-users" id="manage-users-btn" style="display:none">ניהול משתמשים</button>
      </div>

      <!-- Content -->
      <div id="content">
        <button id="logout-btn">התנתקות</button>

      <di<div id="manage-users" class="section">
  <h2>ניהול משתמשים</h2>

  <!-- בחירת משתמש -->
  <div class="um-select-wrap">
    <label for="um-user-select">בחר משתמש</label>
    <select id="um-user-select">
      <option value="">-- בחר משתמש --</option>
    </select>
    <button id="um-refresh-btn">↻ רענן רשימה</button>
  </div>

  <!-- כרטיס משתמש -->
  <div id="um-user-card" style="display:none">

    <div class="um-card-top">
      <div class="um-avatar" id="um-avatar">א</div>
      <div>
        <div class="um-fullname" id="um-fullname">שם מלא</div>
        <div class="um-username-display" id="um-username-display">@username</div>
      </div>
      <span class="um-badge" id="um-role-badge">role</span>
    </div>

    <div class="um-divider"></div>

    <!-- פרטי משתמש לעריכה -->
    <div class="um-fields">
      <div class="um-field-group">
        <label>שם מלא</label>
        <input type="text" id="um-edit-fullname" placeholder="שם מלא" />
      </div>
      <div class="um-field-group">
        <label>שם משתמש</label>
        <input type="text" id="um-edit-username" placeholder="username" />
      </div>
      <div class="um-field-group">
        <label>אימייל</label>
        <input type="email" id="um-edit-email" placeholder="email" />
      </div>
      <div class="um-field-group" id="um-role-field">
        <label>הרשאה (Role)</label>
        <select id="um-edit-role">
          <option value="pending">ממתין (pending)</option>
          <option value="user">משתמש (user)</option>
          <option value="admin">מנהל (admin)</option>
          <option value="superadmin">סופר מנהל (superadmin)</option>
        </select>
      </div>
    </div>

    <div class="um-card-actions">
      <button id="um-save-btn">שמור שינויים</button>
      <button id="um-delete-btn" class="um-btn-danger">מחק משתמש</button>
    </div>

    <div id="um-feedback" class="um-feedback"></div>
  </div>
</div>


        <!-- תגובות -->
        <div id="comments-section" class="section">
          <h2>שיתופים שהתקבלו</h2>
          <div class="messages-wall-cards" id="comment-cards"></div>
        </div>

        <!-- צור קשר -->
        <div id="contacts-container" class="section">
          <h2>טפסי צור קשר</h2>
          <div id="contacts-list"></div>
        </div>


        <!-- העלאת תמונות -->
        <div id="upload-section" class="section">
          <h2>העלאת תמונות לאתר)</h2>
          <label for="upload-tag">בחרו קטגוריה</label>
          <select id="upload-tag">
            <option value="homepage">עמוד הבית</option>
            <option value="jerusalem">מרכזית ירושלים</option>
            <option value="savidor">סבידור מרכז</option>
            <option value="heifa">חיפה לב המפרץ</option>
            <option value="beerSheva">באר שבע</option>
            <option value="kisufim">כיסופים</option>
            <option value="julis">ג'וליס</option>
            <option value="shatz">שערי צדק</option>
          </select>

          <input type="file" id="upload-files" multiple />
          <button id="upload-btn">העלה תמונות</button>
          <button id="clear-file" style="display:none">X</button>
          <div id="upload-status"></div>
        </div>
      </div>
    </div>

    <div id="unauthorized" style="display: none">
     <!--  <h1>גישה לא מורשית</h1>
      <p>אנא התחבר מחדש</p> -->
      <h1>עמוד הניהול בתיקונים זמנית, עמכם הסליחה</h1>
      <p>למשהו דחוף צרו קשר עם ינאי אילוז</p>
      
    </div>

    <script src="/admin.js" defer></script>
<!--     <script src="/admin-index.js" defer></script> -->
  </body>
</html>
