<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>איפוס סיסמה — שליחת קישור</title>

  <!-- גופנים אופציונליים -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f5f7fb;
      --card: #ffffff;
      --accent: #2b6cb0;
      --accent-2: #2c7a7b;
      --muted: #65707a;
      --danger: #e53e3e;
      --success: #2f855a;
      --glass: rgba(255,255,255,0.7);
    }

    html,body{
      height:100%;
      margin:0;
      font-family: "Heebo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #eef2f7 0%, var(--bg) 100%);
      color:#0f1724;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      direction:rtl;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:520px;
      background:var(--card);
      border-radius:14px;
      box-shadow: 0 8px 30px rgba(16,24,40,0.08);
      padding:28px;
      box-sizing:border-box;
      border: 1px solid rgba(16,24,40,0.04);
    }

    header.card-head{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }
    .logo {
      width:52px;
      height:52px;
      border-radius:10px;
      background: linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:700;
      font-size:20px;
      box-shadow: 0 6px 18px rgba(43,108,176,0.18);
    }
    h1{
      margin:0;
      font-size:18px;
      font-weight:600;
      letter-spacing:0.2px;
    }
    p.lead{
      margin:8px 0 18px 0;
      color:var(--muted);
      font-size:14px;
    }

    form {
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    label{
      font-size:13px;
      color:var(--muted);
      display:block;
    }

    input[type="email"]{
      width:100%;
      padding:12px 14px;
      font-size:15px;
      border-radius:10px;
      border:1px solid rgba(16,24,40,0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(245,247,250,0.9));
      outline:none;
      box-sizing:border-box;
      transition:box-shadow .14s, border-color .14s;
    }
    input[type="email"]:focus{
      box-shadow:0 6px 20px rgba(43,108,176,0.08);
      border-color: rgba(43,108,176,0.9);
    }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:6px;
    }

    button.primary{
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      color:white;
      padding:10px 16px;
      border-radius:10px;
      border: none;
      cursor:pointer;
      font-weight:600;
      box-shadow: 0 8px 20px rgba(43,108,176,0.12);
      transition: transform .08s ease, box-shadow .12s;
    }
    button.primary:active{ transform: translateY(1px); }
    button.primary[disabled]{
      opacity:0.6;
      cursor:default;
      transform:none;
      box-shadow:none;
    }

    button.ghost{
      background:transparent;
      border:1px solid rgba(16,24,40,0.06);
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      color:var(--muted);
      font-weight:600;
    }

    .msg{
      padding:10px 12px;
      border-radius:10px;
      font-size:14px;
      display:inline-block;
    }
    .msg.success{ background: rgba(47,133,90,0.08); color:var(--success); border:1px solid rgba(47,133,90,0.12); }
    .msg.error{ background: rgba(229,62,62,0.08); color:var(--danger); border:1px solid rgba(229,62,62,0.10); }
    .muted{ color:var(--muted); font-size:13px; }

    footer.card-foot{
      margin-top:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    @media (max-width:420px){
      .card{ padding:18px; border-radius:12px; }
      .logo { width:44px; height:44px; font-size:18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="page-title">
      <header class="card-head">
        <div class="logo" aria-hidden="true">FM</div>
        <div>
          <h1 id="page-title">שחכת סיסמה? שלחנו קישור לאיפוס</h1>
          <p class="lead">הכנס/י את כתובת האימייל המשויכת לחשבונך ונשלח הוראות לאיפוס הסיסמה. אם אין חשבון — לא נחשוף מידע.</p>
        </div>
      </header>

      <!-- טופס הבקשה -->
      <form id="req-reset" novalidate>
        <label for="req-email">כתובת אימייל</label>
        <input id="req-email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        <div class="controls">
          <button type="submit" class="primary" id="send-btn">שלח קישור לאיפוס</button>
          <button type="button" class="ghost" id="back-btn" onclick="window.location.href='/login.html'">חזור לדף ההתחברות</button>
        </div>

        <div aria-live="polite" id="req-msg" style="margin-top:6px"></div>
      </form>

      <footer class="card-foot">
        <span class="muted">לא קיבלת אימייל? בדוק תיקיית Junk/Spam</span>
        <small class="muted">Flowerman • ©</small>
      </footer>
    </div>
  </div>

  <script>
    (function(){
      const form = document.getElementById('req-reset');
      const input = document.getElementById('req-email');
      const msg = document.getElementById('req-msg');
      const btn = document.getElementById('send-btn');

      function showMessage(text, type){
        msg.innerHTML = '';
        const el = document.createElement('div');
        el.className = 'msg ' + (type === 'error' ? 'error' : 'success');
        el.textContent = text;
        msg.appendChild(el);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        const email = input.value.trim();
        if (!email) {
          showMessage('אנא הזן אימייל תקין', 'error');
          return;
        }

        try {
          btn.disabled = true;
          btn.textContent = 'שולח…';

          const res = await fetch('/auth/request-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          // ה־API מחזיר success גם אם אין משתמש - זה מגניב מבחינת אבטחה
          if (res.ok) {
            showMessage('אם יש חשבון עם אימייל זה — נשלחה הוראה להחלפת סיסמה.', 'success');
            form.reset();
          } else {
            const data = await res.json().catch(()=>null);
            const err = (data && data.error) ? data.error : 'שגיאה בשרת. נסה שוב מאוחר יותר.';
            showMessage(err, 'error');
          }
        } catch (err) {
          console.error('Request reset error:', err);
          showMessage('שגיאה ברשת. בדוק את החיבור ונסה שנית.', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'שלח קישור לאיפוס';
        }
      });
    })();
  </script>
</body>
</html>
